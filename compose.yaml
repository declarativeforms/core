name: declarativeforms

services:
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=declarativeforms_edge
      - "traefik.http.routers.declarativeforms.rule=Host(`${DOMAIN:-forms.example.com}`)"
      - traefik.http.routers.declarativeforms.entrypoints=websecure
      - traefik.http.routers.declarativeforms.tls=true
      - traefik.http.routers.declarativeforms.tls.certresolver=letsencrypt
      - traefik.http.services.declarativeforms.loadbalancer.server.port=8080

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN:-forms.example.com}}
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-declarativeforms}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_S3_BUCKET_NAME: ${MINIO_BUCKET:-declarativeforms}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - backend
      - egress
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      create_bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp:
    build:
      context: .
      target: mcp
    restart: unless-stopped
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env}
      MCP_BASE_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      NODE_ENV: production
      PORT: "8080"
      RENDER_BASE_URL: https://${DOMAIN:-forms.example.com}
    networks:
      - edge
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=declarativeforms_edge
      - "traefik.http.routers.declarativeforms-mcp.rule=Host(`${MCP_DOMAIN:?Set MCP_DOMAIN in .env}`)"
      - traefik.http.routers.declarativeforms-mcp.entrypoints=websecure
      - traefik.http.routers.declarativeforms-mcp.tls=true
      - traefik.http.routers.declarativeforms-mcp.tls.certresolver=letsencrypt
      - traefik.http.services.declarativeforms-mcp.loadbalancer.server.port=8080

  scheduler:
    build:
      context: .
      target: api
    command: ["node", "packages/api/dist/scheduler.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-declarativeforms}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    networks:
      - backend
      - egress
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE_NAME:-declarativeforms}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand(''ping'').ok ? 0 : 2)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  create_bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-declarativeforms}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  mongodb_data:
  minio_data:
  traefik_certs:
