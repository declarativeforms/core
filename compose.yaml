name: declarativeforms

services:
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ghcr.io/declarativeforms/core-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      API_INTERNAL_ORIGIN: ${API_INTERNAL_ORIGIN:-http://api:8080}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=declarativeforms_edge
      - "traefik.http.routers.declarativeforms.rule=Host(`${DOMAIN:-forms.example.com}`)"
      - traefik.http.routers.declarativeforms.entrypoints=websecure
      - traefik.http.routers.declarativeforms.tls=true
      - traefik.http.routers.declarativeforms.tls.certresolver=letsencrypt
      - traefik.http.services.declarativeforms.loadbalancer.server.port=8080

  api:
    image: ghcr.io/declarativeforms/core-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN:-forms.example.com}}
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-declarativeforms}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_S3_BUCKET_NAME: ${MINIO_BUCKET:-declarativeforms}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      GITHUB_FORM_PREFIX: ${GITHUB_FORM_PREFIX:-a}
      INTERNAL_FORM_PREFIX: ${INTERNAL_FORM_PREFIX:-i}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_STATE_SECRET: ${AUTH_STATE_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      MANAGEMENT_BASE_URL: ${MANAGEMENT_BASE_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-user:email}
      FORMS_MAX_DEFINITION_BYTES: ${FORMS_MAX_DEFINITION_BYTES:-262144}
    networks:
      - backend
      - egress
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      create_bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  scheduler:
    image: ghcr.io/declarativeforms/core-api:${IMAGE_TAG:-latest}
    command: ["node", "packages/api/dist/scheduler.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-declarativeforms}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      GITHUB_FORM_PREFIX: ${GITHUB_FORM_PREFIX:-a}
      INTERNAL_FORM_PREFIX: ${INTERNAL_FORM_PREFIX:-i}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_STATE_SECRET: ${AUTH_STATE_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    networks:
      - backend
      - egress
    depends_on:
      mongodb:
        condition: service_healthy

  # Keeps web, api and scheduler on the newest published image without a manual
  # redeploy, by running the same two commands an operator would: `compose pull`
  # then `compose up -d`. Traefik, MongoDB and MinIO are deliberately absent:
  # their versions are pinned above and move only when an operator says so.
  updater:
    image: docker:28-cli
    restart: unless-stopped
    environment:
      # Seconds between checks. Set to 0 to park the updater without removing it.
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      UPDATE_SERVICES: ${UPDATE_SERVICES:-web api scheduler}
    volumes:
      # Root-equivalent access to the host. Required to recreate containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # A relative source resolves against the Compose project directory, so
      # this mounts whichever directory holds compose.yaml and .env.
      - .:/stack:ro
    # The daemon performs the image transfer, so this container needs no network.
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        COMPOSE="docker compose --project-directory /stack --env-file /stack/.env"

        # A managed container is stale when the tag it was created from now
        # resolves to a different image than the one it is running.
        stale() {
          for service in $$UPDATE_SERVICES; do
            id=$$($$COMPOSE ps -q "$$service" 2>/dev/null) || return 0
            [ -n "$$id" ] || return 0
            running=$$(docker inspect -f '{{.Image}}' "$$id" 2>/dev/null) || return 0
            tag=$$(docker inspect -f '{{.Config.Image}}' "$$id" 2>/dev/null) || return 0
            published=$$(docker image inspect -f '{{.Id}}' "$$tag" 2>/dev/null) || return 0
            [ "$$running" = "$$published" ] || return 0
          done
          return 1
        }

        case "$$UPDATE_INTERVAL" in
          ''|*[!0-9]*)
            echo "updater: UPDATE_INTERVAL must be a whole number of seconds" >&2
            while :; do sleep 86400; done
            ;;
        esac

        if [ "$$UPDATE_INTERVAL" -eq 0 ]; then
          echo "updater: UPDATE_INTERVAL=0, auto-update is off"
          while :; do sleep 86400; done
        fi

        echo "updater: checking $$UPDATE_SERVICES every $${UPDATE_INTERVAL}s"

        # Sleep first: on a fresh deploy the outer `up -d --wait` is still
        # running, and two Compose processes must not write the project at once.
        while :; do
          sleep "$$UPDATE_INTERVAL"

          if ! timeout 600 $$COMPOSE pull --quiet $$UPDATE_SERVICES; then
            echo "updater: pull failed, stack left untouched" >&2
            continue
          fi

          stale || continue

          echo "updater: new image published, recreating $$UPDATE_SERVICES"
          if timeout 300 $$COMPOSE up -d --no-deps --wait --wait-timeout 180 $$UPDATE_SERVICES; then
            echo "updater: done"
            # Dangling images only, so the pinned images above are never touched.
            docker image prune -f >/dev/null 2>&1 || true
          else
            echo "updater: recreate did not report healthy, check 'docker compose logs api web'" >&2
          fi
        done

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE_NAME:-declarativeforms}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand(''ping'').ok ? 0 : 2)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  create_bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-declarativeforms}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  mongodb_data:
  minio_data:
  traefik_certs:
