# yaml-language-server: $schema=https://frms.dev/schema.json
version: 1
locale: "en"

title: "Apply for the Declarative Forms pilot"
description: >-
  We are building a new way to create and manage online forms. Tell us briefly
  how you work today and what you need next. This application takes about three
  minutes. We review every response within one week. Selected applicants will
  be invited to a limited paid pilot, with scope and pricing discussed before
  they decide whether to participate.

theme:
  primary: "#542EBC"

sections:
  - id: contact
    title: "How can we reach you?"
    fields:
      - id: utm_source
        type: hidden

      - id: utm_medium
        type: hidden

      - id: utm_campaign
        type: hidden

      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required
          - type: pattern
            regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
            message: "Enter a valid email address."

      - id: organization_or_profile
        type: short_text
        label: "Organization, product, or profile link"
        placeholder: "Optional"
        validators:
          - type: max_length
            value: 200

    next: experience

  - id: experience
    title: "How do forms fit into your work?"
    fields:
      - id: recent_form_involvement
        type: single_select
        label: >-
          In the past three months, which best describes your closest
          involvement with an online form?
        options:
          - label: "I created, published, or maintained one"
            value: "owner"
          - label: "I helped plan, review, or analyze one"
            value: "contributor"
          - label: "I only completed forms as a respondent"
            value: "respondent"
          - label: "I researched form tools but did not work on a form"
            value: "explorer"
          - label: "None of these"
            value: "none"
        validators:
          - required

      - id: current_workflow
        type: multiple_select
        label: "What do you currently use to create or manage forms?"
        allow_other: true
        options:
          - label: "Google Forms or Microsoft Forms"
            value: "google_microsoft"
          - label: "Typeform, Tally, Jotform, or Youform"
            value: "form_builder"
          - label: "Airtable, spreadsheets, or no-code tools"
            value: "no_code"
          - label: "AI assistants"
            value: "ai_assistants"
          - label: "Code, configuration files, or custom software"
            value: "code_configuration"
          - label: "Git repositories or pull requests"
            value: "git_workflow"
          - label: "I do not currently manage forms"
            value: "no_current_workflow"
        validators:
          - type: min
            value: 1
            message: "Select at least one option."

      - id: recent_form_story
        type: long_text
        label: >-
          Think about the most recent form you worked on. What was it for, and
          what was the hardest or most time-consuming part?
        placeholder: "A short, concrete example is enough."
        validators:
          - type: max_length
            value: 750

    next: fit

  - id: fit
    title: "What would make this useful now?"
    fields:
      - id: next_form_timing
        type: single_select
        label: "When might you next create or substantially update a form?"
        options:
          - label: "I am working on one now"
            value: "active_now"
          - label: "Within the next 30 days"
            value: "within_30_days"
          - label: "In 1–3 months"
            value: "one_to_three_months"
          - label: "Later than three months"
            value: "later"
          - label: "I do not have a specific project planned"
            value: "no_current_plan"
        validators:
          - required

      - id: next_form_story
        type: long_text
        label: "What would you use it for?"
        placeholder: "Briefly describe the project, audience, or outcome."
        visible_when: >-
          data.next_form_timing === 'active_now' ||
          data.next_form_timing === 'within_30_days' ||
          data.next_form_timing === 'one_to_three_months'
        validators:
          - required
          - type: min_length
            value: 20
            message: "Please tell us a little about the project."
          - type: max_length
            value: 750

      - id: purchase_role
        type: single_select
        label: "How would a new tool like this normally be approved?"
        options:
          - label: "I can make and fund the decision"
            value: "decision_and_budget"
          - label: "I can decide, but need budget approval"
            value: "decision_needs_budget"
          - label: "I can recommend it, but someone else decides"
            value: "recommend_only"
          - label: "I would purchase it personally"
            value: "personal_purchase"
          - label: "I do not currently have a purchase path"
            value: "no_purchase_path"
        validators:
          - required

      - id: feedback_formats
        type: multiple_select
        label: "If selected, how could you share feedback?"
        options:
          - label: "Short written feedback"
            value: "written"
          - label: "A brief recording"
            value: "recording"
          - label: "A short call"
            value: "call"
          - label: "Anonymous product-usage analytics"
            value: "usage_analytics"
          - label: "I could use it, but not provide feedback right now"
            value: "none"

      - id: product_updates
        type: single_select
        label: >-
          May Declarative Forms email you occasional launch and product updates?
          This is separate from messages about this application, and you can
          unsubscribe at any time.
        options:
          - label: "Yes, send me product updates"
            value: "yes"
          - label: "No, application messages only"
            value: "no"
        validators:
          - required

    next: done

completion:
  title: "Thanks, {{data.full_name}}"
  message: >-
    We received your application and will review it within one week. We will
    contact selected applicants to discuss the paid pilot. If this cohort is not
    the right fit, we will keep your application on the waitlist.
