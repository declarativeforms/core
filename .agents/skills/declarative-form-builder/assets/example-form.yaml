version: 1
title: "Event registration"
description: "Register for our upcoming event. Spots are limited."

# Custom theme color — replace with your brand color.
theme:
  primary: "#4F46E5"

# Optional: restrict the form to a specific date range.
# start_date: "2026-04-01"
# end_date: "2026-06-30"

sections:

  # --- Section 1: Personal details ---
  - id: personal
    title: "Your details"
    fields:
      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required

      - id: phone
        type: mobile_number
        label: "Phone number (optional)"
        placeholder: "+1 555 123 4567"

    next: preferences

  # --- Section 2: Event preferences ---
  - id: preferences
    title: "Event preferences"
    fields:
      - id: ticket_type
        type: single_select
        label: "Which ticket type would you like?"
        options:
          - "General admission"
          - "VIP"
          - "Online (virtual)"
        validators:
          - required

      # This field only appears when the user picks VIP.
      - id: dietary_requirements
        type: short_text
        label: "Dietary requirements"
        placeholder: "e.g. vegetarian, gluten-free"
        visible_when: "data.ticket_type === 'VIP'"

      - id: how_heard
        type: dropdown
        label: "How did you hear about this event?"
        searchable: false
        options:
          - "Social media"
          - "Email newsletter"
          - "Word of mouth"
          - "Search engine"
          - "Other"

      - id: questions
        type: long_text
        label: "Any questions for us?"
        placeholder: "Optional — ask us anything."

    # After preferences, route VIP attendees to a dedicated section.
    next:
      - when: "data.ticket_type === 'VIP'"
        go: "vip"
      - else: "done"

  # --- Section 3: VIP extras (only shown to VIP ticket holders) ---
  - id: vip
    title: "VIP experience"
    fields:
      - id: seat_preference
        type: single_select
        label: "Preferred seating area"
        options:
          - "Front row"
          - "Centre"
          - "No preference"
        validators:
          - required

      - id: plus_one
        type: single_select
        label: "Will you be bringing a plus-one?"
        options:
          - "Yes"
          - "No"
        validators:
          - required

      # Only shown when the user is bringing a plus-one.
      - id: plus_one_name
        type: short_text
        label: "Plus-one full name"
        placeholder: "John Smith"
        visible_when: "data.plus_one === 'Yes'"
        validators:
          - required

    next: done

# Customized thank-you screen.
completion:
  - when: "data.ticket_type === 'VIP'"
    title: "Welcome to the VIP experience!"
    message: "Thank you, {{data.full_name}}. Your VIP registration is confirmed. We will be in touch at {{data.email}} with next steps."
  - title: "You are registered!"
    message: "Thank you, {{data.full_name}}. We look forward to seeing you. A confirmation will be sent to {{data.email}}."

# Send every submission to the organizer's inbox.
# Replace hello@example.com with your actual email address.
connections:
  - type: email
    to: "hello@example.com"
    subject: "New registration: {{data.full_name}} ({{data.ticket_type}})"
    body: "A new registration has been received. Reply to {{data.email}}."
    include_responses: true

  # Also send to Zapier/Make/n8n if you need to sync with other tools.
  # - type: webhook
  #   url: "https://hooks.zapier.com/hooks/catch/your-hook-id"
