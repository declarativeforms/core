services:
  traefik:
    profiles:
      - production

  web:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${CORE_PORT:-8080}:8080"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      PUBLIC_BASE_URL: http://localhost:${CORE_PORT:-8080}
    networks:
      - backend
      - edge

  scheduler:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
