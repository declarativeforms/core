services:
  traefik:
    profiles:
      - production

  web:
    ports:
      - "${CORE_PORT:-8080}:8080"

  api:
    environment:
      PUBLIC_BASE_URL: http://localhost:${CORE_PORT:-8080}
    networks:
      - backend
      - edge

  mcp:
    ports:
      - "${MCP_PORT:-8081}:8080"
    environment:
      RENDER_BASE_URL: http://localhost:${CORE_PORT:-8080}
