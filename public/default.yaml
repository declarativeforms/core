version: 1
title: "Declarative Forms — Early Users & Interviews"
description: "We’re building a new way to create and manage forms using GitHub. This is a short form (1–2 minutes) to find early users. If you’re a fit, we’ll invite you to a 30-min call and send a $50 voucher."

sections:
  - id: section_1
    title: Section 1
    fields:
      - id: question_1
        type: single_select
        label: How important are forms in your work?
        options:
          - Critical (core part of my job)
          - Important
          - Nice to have
          - Not important
        validators:
          - required

      - id: question_2
        type: multiple_select
        label: Which form tools do you currently use? (Select all that apply)
        options:
          - Google Forms
          - Typeform
          - Tally
          - Airtable forms
          - Notion forms
          - HubSpot / CRM forms
          - Custom-built
          - Other
        validators:
          - required

      - id: question_3
        type: single_select
        label: How familiar are you with GitHub?
        options:
          - I use it daily
          - I use it sometimes
          - I know what it is
          - I don’t use GitHub
        validators:
          - required
    next: section_2

  - id: section_2
    title: Section 2
    fields:
      - id: question_4
        type: long_text
        label: What’s the most annoying thing about how you create or manage forms today?
        placeholder: One sentence is enough.
    next: section_3

  - id: section_3
    title: Section 3
    fields:
      - id: question_5
        type: single_select
        label: Would you be open to a 30-min interview? (We’ll send a $50 voucher.)
        options:
          - Yes
          - Maybe
          - No
        validators:
          - required

    next:
      - when: data.question_5 == "Yes" || data.question_5 == "Maybe"
        go: section_4
      - else: done

  - id: section_4
    title: "Section 4"
    fields:
      - id: question_6
        type: short_text
        label: Name
        validators:
          - required

      - id: question_7
        type: email
        label: Work Email
        validators:
          - required
          
    next: https://github.com/declarativeforms
