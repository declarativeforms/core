name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI document
        run: npm run check:openapi

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Build packages and applications
        run: npm run build

      - name: Check publishable package contents
        run: npm run pack:check

  validate-containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example --file docker/compose.yaml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.example --file docker/compose.yaml build api web
