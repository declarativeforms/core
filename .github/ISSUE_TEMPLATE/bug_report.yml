name: Bug report
description: Report reproducible behavior that does not match the documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private repository details, form responses,
        or vulnerability information. Report security issues using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe YAML example and exact steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local Node.js development
        - Library package
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant safe logs
      description: Remove tokens, repository secrets, form responses, and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the documentation and existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true

