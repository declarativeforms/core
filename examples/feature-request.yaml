# yaml-language-server: $schema=https://frms.dev/schema.json
version: 1
title: "Request a feature in Declarative Forms"
description: "Tell us what your workflow needs. If we accept the request, we’ll build it within 72 hours. We’ll confirm acceptance and scope by email. The 72-hour window starts when we accept."

start:
  button: "Request a feature"

theme:
  primary: "#542EBC"

sections:
  - id: request
    title: "Request a feature"
    adaptive:
      objectives:
        - Understand the feature being requested, clarifying incomplete or ambiguous details without repeating questions already answered.
        - Understand the workflow the feature would help and the desired outcome, reusing information already supplied.
      properties:
        feature:
          type: string
          description: A concise description of the requested feature
          minLength: 1
        use_case:
          type: string
          description: The workflow the feature would help and the desired outcome
          minLength: 1
    next: contact

  - id: contact
    title: "Stay in touch"
    fields:
      - id: email
        type: email
        label: "Your email"
        validators:
          - required
          - type: pattern
            regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
            message: "Enter a valid email address so we can reply."

    next: done

completion:
  title: "Request received"
  message: "We’ll review it and email you. If accepted, we’ll confirm the scope and build it within 72 hours."

connections:
  - type: email
    to: "info@frms.dev"
    subject: "New feature request — Declarative Forms"
    body: |
      <p>A new feature request has been submitted.</p>
      <p><strong>Feature:</strong> {{data.feature}}</p>
      <p><strong>Use case:</strong> {{data.use_case}}</p>
    include_responses: true
    trigger_on: completed
