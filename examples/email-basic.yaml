version: 1
title: "Email"
description: "Plain email field with required and pattern validation."

sections:
  - id: section_1
    title: "Section 1"
    fields:
      - id: question_1
        type: email
        label: "Email address"
        placeholder: "name@example.com"
        validators:
          - required
          - type: pattern
            regex: "^[^@]+@[^@]+\\.[^@]+$"
            message: "Please enter a valid email address."

    next: done
