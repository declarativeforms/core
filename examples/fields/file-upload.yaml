# yaml-language-server: $schema=https://frms.dev/schema.json
version: 1
title: "Field example"
description: "This form demonstrates a single field type."

sections:
  - id: example
    title: "Example field"
    fields:
      - id: response
        type: file_upload
        label: "Response"
        accepted_mime_types:
          - "application/pdf"
          - "image/*"
        validators:
          - type: min
            value: 1
            message: "Upload at least one file."
          - type: max
            value: 3
            message: "Upload at most three files."

completion:
  title: "Complete"
  message: "The response was submitted."
