version: 1
title: "Application"

sections:
  - id: personal
    title: "Personal"
    fields:
      - id: first_name
        type: text
        label: First Name
      - id: last_name
        type: text
        label: Last Name
    next: identity

  - id: identity
    title: "Identity"
    fields:
      - id: idType
        type: select
        label: "ID type"
        options: [Passport, NationalID]
    next:
      - when: idType == "Passport"
        go: passport
      - else: nationalId

  - id: passport
    title: "Passport"
    fields:
      - id: passport
        type: text
        label: Passport
    next: done

  - id: nationalId
    title: "National ID"
    fields:
      - id: identity_number
        type: text
        label: Identity Number
    next: done

