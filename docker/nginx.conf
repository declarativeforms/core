server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api-eu.mixpanel.com https://*.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors *; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # API responses set their own security headers. Defining this header
        # here prevents inheritance of the browser application's CSP/headers.
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
