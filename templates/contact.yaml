version: 1
title: "Contact us"
description: "Send us a message and we will get back to you."

sections:
  - id: contact
    title: "Your details"
    fields:
      # Prefill this field via ?source=... in the URL to track referral channels.
      - id: source
        type: hidden
        label: "Source"

      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required

      - id: inquiry_type
        type: single_select
        label: "Type of inquiry"
        options:
          - "Personal"
          - "Business"
        validators:
          - required

      # Only shown when the inquiry is from a business.
      - id: company
        type: short_text
        label: "Company name"
        placeholder: "Acme Inc."
        visible_when: "data.inquiry_type === 'Business'"

      - id: message
        type: long_text
        label: "Message"
        placeholder: "How can we help?"
        validators:
          - required
          - type: min_length
            value: 10
            message: "Please write at least 10 characters."

    next: done

connections:
  - type: email
    to: "hello@example.com"
    subject: "New message from {{data.full_name}}"
    body: "Reply to {{data.email}}."
    include_responses: true
