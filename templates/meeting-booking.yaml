version: 1
title: "Book a meeting"
description: "Request a time to meet with us."

sections:
  - id: meeting
    title: "Meeting details"
    fields:
      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required

      - id: meeting_type
        type: dropdown
        label: "What is the meeting about?"
        options:
          - "Product demo"
          - "Sales inquiry"
          - "Partnership discussion"
          - "General chat"
        validators:
          - required

      - id: preferred_date
        type: date
        label: "Preferred date"
        validators:
          - required

      - id: preferred_time
        type: time
        label: "Preferred time"
        validators:
          - required
          - type: min
            value: "09:00"
            message: "Please choose a time from 9 AM onwards."
          - type: max
            value: "17:00"
            message: "Please choose a time before 5 PM."

      - id: notes
        type: long_text
        label: "Anything you would like to discuss?"
        placeholder: "Optional — share any context that helps us prepare."

    next: done

completion:
  # Send a tailored message depending on the type of meeting requested.
  - when: "data.meeting_type === 'Product demo'"
    title: "Demo request received"
    message: "Thanks, {{data.full_name}}. Our team will send a calendar invite to {{data.email}} shortly."
  - title: "Meeting requested"
    message: "Thanks, {{data.full_name}}. We will confirm your meeting time at {{data.email}}."

connections:
  - type: email
    to: "meetings@example.com"
    subject: "Meeting request from {{data.full_name}} — {{data.meeting_type}}"
    include_responses: true
