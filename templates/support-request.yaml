version: 1
title: "Support request"
description: "Submit a support request and we will get back to you."

sections:
  - id: support
    title: "How can we help?"
    fields:
      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required

      - id: category
        type: dropdown
        label: "Category"
        options:
          - label: "Billing"
            value: "billing"
          - label: "Technical issue"
            value: "technical"
          - label: "Account access"
            value: "account"
          - label: "Feature request"
            value: "feature"
          - label: "Other"
            value: "other"
        validators:
          - required

      - id: priority
        type: single_select
        label: "How urgent is this?"
        options:
          - label: "I cannot use the product"
            value: "urgent"
          - label: "It is affecting my work"
            value: "high"
          - label: "I can wait a bit"
            value: "normal"
        validators:
          - required

      - id: description
        type: long_text
        label: "Describe your issue"
        placeholder: "Please include as much detail as possible."
        validators:
          - required
          - type: min_length
            value: 20
            message: "Please provide at least 20 characters of detail."

      # Only shown for technical issues — helps our engineers reproduce the problem.
      - id: reproduction_steps
        type: long_text
        label: "Steps to reproduce"
        placeholder: "1. Go to...\n2. Click on...\n3. See error"
        visible_when: "data.category === 'technical'"

      - id: attachment
        type: file_upload
        label: "Attachments (optional)"
        validators:
          - type: max
            value: 3
            message: "You can upload at most 3 files."

    next: done

connections:
  # Route billing issues to the finance team.
  - type: email
    to: "billing@example.com"
    subject: "[{{data.priority}}] {{data.category}} — {{data.full_name}}"
    include_responses: true
    when: "data.category === 'billing'"

  # Route everything else to the support team.
  - type: email
    to: "support@example.com"
    subject: "[{{data.priority}}] {{data.category}} — {{data.full_name}}"
    include_responses: true
    when: "data.category !== 'billing'"
