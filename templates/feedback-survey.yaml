version: 1
title: "Feedback survey"
description: "Tell us how we are doing. Your feedback helps us improve."

sections:
  - id: rating
    title: "Rate your experience"
    fields:
      - id: overall_rating
        type: rating
        label: "How would you rate your overall experience?"
        min_label: "Poor"
        max_label: "Excellent"
        validators:
          - required

      - id: recommend
        type: single_select
        label: "Would you recommend us to a friend?"
        options:
          - "Yes"
          - "No"
          - "Maybe"
        validators:
          - required

    next:
      # Route unhappy respondents to a dedicated follow-up section.
      - when: "data.overall_rating <= 2"
        go: "concerns"
      # Everyone else moves on to the general details section.
      - else: "details"

  - id: concerns
    title: "We are sorry to hear that"
    fields:
      - id: issue
        type: long_text
        label: "What went wrong?"
        placeholder: "Please tell us what we could have done better."
        validators:
          - required

      - id: contact_me
        type: single_select
        label: "Would you like us to follow up with you?"
        options:
          - "Yes, please reach out"
          - "No, thank you"
        validators:
          - required

      # Only shown when the respondent wants to be contacted.
      - id: contact_email
        type: email
        label: "Your email address"
        placeholder: "jane@example.com"
        visible_when: "data.contact_me === 'Yes, please reach out'"
        validators:
          - required

    next: done

  - id: details
    title: "Tell us more"
    fields:
      - id: liked
        type: long_text
        label: "What did you like most?"
        placeholder: "Tell us what worked well."

      - id: improve
        type: long_text
        label: "What could we improve?"
        placeholder: "Tell us what we can do better."

      - id: email
        type: email
        label: "Email address (optional)"
        placeholder: "jane@example.com"

    next: done

# Show different thank-you messages depending on the rating given.
completion:
  - when: "data.overall_rating <= 2"
    title: "Thank you for your honest feedback"
    message: "We are sorry to hear about your experience. Our team will review what you shared."
  - title: "Thank you for your feedback!"
    message: "We are glad you took the time to share your thoughts."

connections:
  - type: webhook
    url: "https://hooks.zapier.com/hooks/catch/your-hook-id"
