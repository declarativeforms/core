version: 1
title: "Event registration"
description: "Register for our upcoming event."

# The registration window opens on 1 April and closes on 14 April.
start_date: "2026-04-01T00:00:00.000Z"
end_date: "2026-04-14T23:59:59.000Z"

sections:
  - id: attendee
    title: "Attendee information"
    fields:
      - id: full_name
        type: short_text
        label: "Full name"
        placeholder: "Jane Smith"
        validators:
          - required

      - id: email
        type: email
        label: "Email address"
        placeholder: "jane@example.com"
        validators:
          - required

      - id: company
        type: short_text
        label: "Company or organization"
        placeholder: "Acme Inc."

      - id: dietary
        type: dropdown
        label: "Dietary requirements"
        options:
          - "None"
          - "Vegetarian"
          - "Vegan"
          - "Gluten-free"
          - "Halal"
          - "Kosher"

    next: sessions

  - id: sessions
    title: "Session preferences"
    fields:
      - id: sessions
        type: multiple_select
        label: "Which sessions would you like to attend?"
        # allow_other lets attendees write in a session not listed.
        allow_other: true
        options:
          - "Opening keynote"
          - "Workshop A"
          - "Workshop B"
          - "Panel discussion"
          - "Networking lunch"
          - "Closing session"
        validators:
          - required
          - type: min
            value: 1
            message: "Please select at least one session."

      - id: notes
        type: long_text
        label: "Anything else we should know?"
        placeholder: "Accessibility needs, questions, etc."

    next: done

completion:
  title: "You are registered!"
  message: "Thanks, {{data.full_name}}. See you at the event."
  button:
    label: "View event details"
    url: "https://example.com/event"

connections:
  - type: email
    to: "events@example.com"
    subject: "Registration from {{data.full_name}}"
    include_responses: true

  # Store every registration in Airtable for easy management.
  - type: airtable
    connection_id: "your-airtable-connection-id"
    base_id: "your-base-id"
    table_id_or_name: "Registrations"
